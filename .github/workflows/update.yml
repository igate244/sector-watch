# 平日の大引け後に株価を取得 → 計算 → ニュース判定 → 画面をビルド → GitHub Pages に公開
name: update

on:
  # 定時の計算は cron-job.org（外の無料サービス）から workflow_dispatch で起こす。
  # GitHub の schedule は数時間遅れたり飛ばされたりしたのでやめた（2026-11）。
  # 平日（日本時間）: 11:43 midday ／ 16:41 close ／ 19:13 news（force=false）
  push:
    branches: [main]         # 画面やロジックを直したら、そのまま公開し直す（Gemini は呼ばない）
  workflow_dispatch:         # cron-job.org からの定時の合図と、GitHub アプリの「Run workflow」
    inputs:
      mode:
        description: "midday＝昼（前場の途中）／close＝夕方（終値）／news＝夜（ニュース確認）"
        type: choice
        options: [news, midday, close]
        default: news
      force:
        description: "今日のニュース確認が済んでいても Gemini を呼び直す"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      skip: ${{ steps.calc.outputs.skip }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 計算に使う部品を入れる
        run: pip install -r requirements.txt

      - name: 株価の取得と計算
        id: calc
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}       # 未設定なら Google ニュースの見出しだけ
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          NEWS_MAX_CALLS: ${{ vars.NEWS_MAX_CALLS || '30' }}
          # push のときは Gemini を呼ばず、公開中の前回の判定を使い回す
          NEWS_MODE: ${{ github.event_name == 'push' && 'reuse' || '' }}
          NEWS_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'news' }}
          PREV_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/latest.json
        run: python -m pipeline.run --out web/public/data

      - uses: actions/setup-node@v5
        if: steps.calc.outputs.skip != 'true'   # データが古くて見送ったときは何もしない
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 画面のビルド（型チェック込み）
        if: steps.calc.outputs.skip != 'true'
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        if: steps.calc.outputs.skip != 'true'   # データが古くて見送ったときは何もしない
        with:
          path: web/dist


  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'   # 見送った回は公開し直さない
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
